lakehouse_databricks:
  target: prod
  outputs:
    prod:
      type: databricks
      catalog: "{{ env_var('DATABRICKS_CATALOG_PRATA', 'portfolio-lakehouse-prata') }}"
      schema: gd
      host: "{{ env_var('DATABRICKS_HOST', '') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH', '') }}"
      token: "{{ env_var('DATABRICKS_TOKEN', '') }}"
      threads: 4