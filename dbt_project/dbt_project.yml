name: 'enterprise_data_lakehouse'
version: '1.0.0'
config-version: 2

profile: 'lakehouse_databricks'

model-paths: ["models"]
macro-paths: ["macros"]

models:
  enterprise_data_lakehouse:
    prata:
      +database: "portfolio-lakehouse-prata"
      tempo:
        +schema: tempo
        +file_format: delta
        +location_root: "abfss://portfolio-lakehouse-prata@portfolioigordatalake.dfs.core.windows.net/corporativo/tempo"
      localidade:
        +schema: localidade
        +file_format: delta
        +location_root: "abfss://portfolio-lakehouse-prata@portfolioigordatalake.dfs.core.windows.net/corporativo/localidade"
      gd:
        +schema: gd
        +file_format: delta
        +location_root: "abfss://portfolio-lakehouse-prata@portfolioigordatalake.dfs.core.windows.net/aneel/gd"
    ouro:
      +database: "portfolio-lakehouse-ouro"
      gd:
        +schema: gd
        +file_format: delta
        +location_root: "abfss://portfolio-lakehouse-ouro@portfolioigordatalake.dfs.core.windows.net/aneel/gd"
